name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    name: Release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install isolated release validation tools
        run: npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund release-please@17.3.0 ajv@8.20.0

      - name: Verify version updates and merged PR release recognition
        run: node scripts/test-release-config.cjs "$RUNNER_TEMP/release-tools"

  windows:
    name: Windows x64 / Node.js 24
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: x64
          package-manager-cache: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Install npm project
        run: npm ci --ignore-scripts

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust warnings
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build native executable
        run: npm run build

      - name: Test Rust and Node launcher
        run: npm test

      - name: Pack and test installed package
        run: npm run test:package

      - name: Upload tested npm package
        uses: actions/upload-artifact@v7
        with:
          name: xbot-cli-windows-x64-${{ github.sha }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 14
